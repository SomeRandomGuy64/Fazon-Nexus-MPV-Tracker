# Fazon Nexus Tracker settings. Copy this file to script-opts/fazon_track.conf in your mpv
# config folder (~/.config/mpv/ on Linux and macOS, %APPDATA%\mpv\ on Windows).
# Write values without quotes, and don't put spaces around "=".

# Required: a "Read & write" API key from your fazon.nexus profile (Developers section).
# (Or leave it empty and set the FAZON_API_KEY environment variable instead.)
api_key=

# Hotkeys. Press one to track what's playing, press it again to stop.
# Pressing the other one switches over.
key_active=Ctrl+a
key_passive=Ctrl+p

# Ask for the sub-category name before tracking (yes), or use the suggestion as it is (no).
prompt=yes

# Suggest this sub-category name instead of the video's title, e.g. subcat=Anime
subcat=

# When the playlist moves to the next video, keep tracking it under its own title (yes),
# or stop tracking (no).
continue_on_next_file=yes

# How often to send time to the site while tracking, in minutes.
flush_minutes=5

# The Track API. Only change this if you run your own copy of the site.
api_url=https://api.fazon.nexus/v1/api/track
